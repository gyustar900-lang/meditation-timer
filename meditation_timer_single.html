<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>瞑想タイマー</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 単一ファイル版ではスタイルをこの中に直接記述します -->
    <style>
    /* 全体の基本スタイル */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    body {
      background-color: #0a192f; /* 濃紺：静かで深い色合い */
      color: #f5f5f5;           /* 白に近い色合いで目に優しい */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .title {
      margin-bottom: 1.5rem;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 0.1rem;
    }

    .instruction {
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.8rem;
      margin-bottom: 1.5rem;
    }

    .time-btn {
      background-color: #014f43; /* 深緑のボタン */
      color: #f5f5f5;
      padding: 0.7rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .time-btn:hover, .time-btn.selected {
      background-color: #04796f;
    }

    .control-btn {
      background-color: #014f43;
      color: #f5f5f5;
      padding: 0.8rem 1.2rem;
      margin: 0.5rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
      min-width: 100px;
    }

    .control-btn:hover {
      background-color: #04796f;
    }

    .control-btn.primary {
      background-color: #936639; /* 金色に近い茶色 */
      color: #fff;
    }

    .control-btn.primary:hover {
      background-color: #b3834b;
    }

    .time-display {
      font-size: 3rem;
      margin-bottom: 1rem;
      letter-spacing: 0.1rem;
    }

    .message {
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
      color: #c0c0c0;
    }

    .hidden {
      display: none;
    }

    .finish-screen p {
      margin-bottom: 0.8rem;
      font-size: 1.1rem;
    }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">瞑想タイマー</h1>
        <!-- 時間選択画面 -->
        <div id="selection" class="time-selection">
            <p class="instruction">瞑想する時間を選んでください</p>
            <div class="buttons">
                <button class="time-btn" data-minutes="5">5分</button>
                <button class="time-btn" data-minutes="10">10分</button>
                <button class="time-btn" data-minutes="20">20分</button>
                <button class="time-btn" data-minutes="30">30分</button>
                <button class="time-btn" data-minutes="60">60分</button>
                <button class="time-btn" data-minutes="90">90分</button>
                <button class="time-btn" data-minutes="120">120分</button>
            </div>
            <button id="startBtn" class="control-btn primary">開始</button>
        </div>
        <!-- タイマー画面 -->
        <div id="timerScreen" class="timer-screen hidden">
            <div id="timeDisplay" class="time-display">00:00</div>
            <p class="message">静かに呼吸を整えましょう</p>
            <div class="timer-buttons">
                <button id="pauseBtn" class="control-btn">一時停止</button>
                <button id="resumeBtn" class="control-btn hidden">再開</button>
                <button id="resetBtn" class="control-btn">リセット</button>
            </div>
        </div>
        <!-- 終了画面 -->
        <div id="finishScreen" class="finish-screen hidden">
            <p class="finish-message">終了しました</p>
            <p class="finish-message">おつかれさまでした</p>
            <p class="finish-message">今日の静けさを、少しだけ持ち帰りましょう。</p>
            <button id="againBtn" class="control-btn primary">もう一度</button>
            <button id="chooseBtn" class="control-btn">時間を選び直す</button>
        </div>
    </div>
    <!-- スクリプトをインラインで記述 -->
    <script>
    // タイマーアプリロジック
    const selectionScreen = document.getElementById('selection');
    const timerScreen = document.getElementById('timerScreen');
    const finishScreen = document.getElementById('finishScreen');
    const timeButtons = document.querySelectorAll('.time-btn');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resumeBtn = document.getElementById('resumeBtn');
    const resetBtn = document.getElementById('resetBtn');
    const againBtn = document.getElementById('againBtn');
    const chooseBtn = document.getElementById('chooseBtn');
    const timeDisplay = document.getElementById('timeDisplay');
    let selectedMinutes = null;
    let timerInterval = null;
    let remainingSeconds = 0;

    // 時間選択ボタン
    timeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        selectedMinutes = parseInt(btn.dataset.minutes, 10);
        timeButtons.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });

    // 開始
    startBtn.addEventListener('click', () => {
      if (!selectedMinutes) return;
      remainingSeconds = selectedMinutes * 60;
      selectionScreen.classList.add('hidden');
      timerScreen.classList.remove('hidden');
      updateDisplay();
      startCountdown();
    });

    function startCountdown() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        remainingSeconds--;
        updateDisplay();
        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          finishCountdown();
        }
      }, 1000);
    }

    function updateDisplay() {
      // 時間・分・秒を計算
      const hours = Math.floor(remainingSeconds / 3600);
      const minutes = Math.floor((remainingSeconds % 3600) / 60);
      const seconds = remainingSeconds % 60;
      // 表示形式を決定
      let display;
      if (hours > 0) {
        // 例: 1:05:09
        const hh = String(hours);
        const mm = String(minutes).padStart(2, '0');
        const ss = String(seconds).padStart(2, '0');
        display = `${hh}:${mm}:${ss}`;
      } else {
        const mm = String(minutes).padStart(2, '0');
        const ss = String(seconds).padStart(2, '0');
        display = `${mm}:${ss}`;
      }
      timeDisplay.textContent = display;
    }

    function finishCountdown() {
      playSound();
      timerScreen.classList.add('hidden');
      finishScreen.classList.remove('hidden');
    }

    pauseBtn.addEventListener('click', () => {
      clearInterval(timerInterval);
      pauseBtn.classList.add('hidden');
      resumeBtn.classList.remove('hidden');
    });
    resumeBtn.addEventListener('click', () => {
      startCountdown();
      resumeBtn.classList.add('hidden');
      pauseBtn.classList.remove('hidden');
    });
    resetBtn.addEventListener('click', () => {
      clearInterval(timerInterval);
      timerScreen.classList.add('hidden');
      selectionScreen.classList.remove('hidden');
      timeButtons.forEach(b => b.classList.remove('selected'));
      selectedMinutes = null;
      pauseBtn.classList.remove('hidden');
      resumeBtn.classList.add('hidden');
    });
    againBtn.addEventListener('click', () => {
      finishScreen.classList.add('hidden');
      timerScreen.classList.remove('hidden');
      remainingSeconds = selectedMinutes * 60;
      updateDisplay();
      pauseBtn.classList.remove('hidden');
      resumeBtn.classList.add('hidden');
      startCountdown();
    });
    chooseBtn.addEventListener('click', () => {
      finishScreen.classList.add('hidden');
      selectionScreen.classList.remove('hidden');
      timeButtons.forEach(b => b.classList.remove('selected'));
      selectedMinutes = null;
      pauseBtn.classList.remove('hidden');
      resumeBtn.classList.add('hidden');
    });

    function playSound() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      const ctx = new AudioContextClass();
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.value = 660;
      oscillator.connect(gain);
      gain.connect(ctx.destination);
      oscillator.start();
      gain.gain.setValueAtTime(1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.0);
      oscillator.stop(ctx.currentTime + 1.0);
    }
    </script>
</body>
</html>
